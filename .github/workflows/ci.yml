name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Lint (shellcheck, shfmt)
        run: hk check --all
      - name: Lint (markdown)
        run: dprint check
      - name: Test
        run: bats test/
